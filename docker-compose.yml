services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_FORWARD_PORT}:${DB_PORT}"
    volumes:
      - pastejo-data:/var/lib/postgresql/data
    networks:
      - pastejo-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-pastejo
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_FORWARD_PORT}:${PGADMIN_PORT}"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres-db
    networks:
      - pastejo-network

    configs:
      - source: pgadmin_config
        target: /pgadmin4/servers.json
        mode: 0444
      - source: pgadmin_pass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres-db
      DB_PORT: "5432"
      DB_FORWARD_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "40000:40000"

    depends_on:
      postgres-db:
        condition: service_healthy

    networks:
      - pastejo-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped

    environment:
      FRONTEND_PORT: "40100"
      SERVIDOR_DW3: "http://localhost:40000"

    ports:
      - "40100:40100"

    depends_on:
      - backend

    networks:
      - pastejo-network

volumes:
  pastejo-data:
  pgadmin-data:

networks:
  pastejo-network:
    driver: bridge

configs:
  pgadmin_config:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "PostgreSQL",
            "Group": "Servers",
            "Host": "postgres-db",
            "Port": ${DB_PORT},
            "MaintenanceDB": "${DB_NAME}",
            "Username": "${DB_USER}",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin_pass:
    content: |
      pastejo-db:${DB_PORT}:${DB_NAME}:${DB_USER}:${DB_PASSWORD}
