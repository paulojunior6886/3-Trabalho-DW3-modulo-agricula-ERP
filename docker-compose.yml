services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_FORWARD_PORT}:${DB_PORT}"
    volumes:
      - pastejo-data:/var/lib/postgresql/data
    networks:
      - pastejo-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-pastejo
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_FORWARD_PORT}:${PGADMIN_PORT}"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres-db
    networks:
      - pastejo-network

    configs:
      - source: pgadmin_config
        target: /pgadmin4/servers.json
        mode: 0444
      - source: pgadmin_pass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400

volumes:
  pastejo-data:
  pgadmin-data:

networks:
  pastejo-network:
    driver: bridge

configs:
  pgadmin_config:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "PostgreSQL",
            "Group": "Servers",
            "Host": "postgres-db",
            "Port": ${DB_PORT},
            "MaintenanceDB": "${DB_NAME}",
            "Username": "${DB_USER}",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin_pass:
    content: |
      pastejo-db:${DB_PORT}:${DB_NAME}:${DB_USER}:${DB_PASSWORD}
